  <text class="band" x="288" y="260">INTEGRATION OPTIONS</text>

  <rect class="route" x="288" y="268" width="290" height="90" rx="10"/>
  <text class="rlbl" x="302" y="287">A · EMBEDDED ENGINE</text>
