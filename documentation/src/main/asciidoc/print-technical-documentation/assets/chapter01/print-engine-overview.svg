  <text class="libcp" x="461" y="485">model foundations</text>

  <g class="tp"><rect x="598" y="444" width="147" height="78" rx="8"/></g>
  <text class="tpnm" x="616" y="468">Apache PDFBox</text>
  <text class="cap"  x="616" y="485">writes and tags</text>
  <text class="cap"  x="616" y="499">the PDF</text>

