  <text class="name" x="320" y="318">Your project code</text>
  <text class="cap"  x="320" y="336">implements the provider interfaces</text>

  <text class="orlbl" x="594" y="321" text-anchor="middle">or</text>

  <rect class="route" x="610" y="268" width="290" height="146" rx="10"/>
  <text class="rlbl" x="624" y="287">B · A12 FULL STACK</text>

  <g class="lib"><rect x="624" y="296" width="262" height="48" rx="8"/></g>
  <text class="libnm" x="642" y="318">A12 Full Stack application</text>
