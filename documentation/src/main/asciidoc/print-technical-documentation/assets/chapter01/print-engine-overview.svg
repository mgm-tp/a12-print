<!--
  Print Engine overview — container-level diagram of the Print Engine introduction.

  FILE PATH:  documentation/src/main/asciidoc/print-technical-documentation/assets/chapter01/print-engine-overview.svg
  EMBEDDED AS (the bundle sets :imagesdir: assets/ in index.adoc):
      .Print Engine overview
      image::chapter01/print-engine-overview.svg[alt]
  Update this header if the file moves or a tool re-saves it.

  Composition and context only. The frame is the Print Engine and the context it needs: the four
  printing libraries under the title, the two ways a project uses them, and what they build on.
  The legend carries the four categories. Fill and stroke colour group the boxes; a dashed outline
  carries one meaning only — needed on just one of the two integration options — so never dash a box
  to mark its category.
  Every fact here is also stated in the Introduction prose.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 606" width="1190" height="606" role="img" aria-labelledby="t d" font-family="'Segoe UI', Inter, system-ui, sans-serif">
  <title id="t">Print Engine overview</title>
  <desc id="d">Four Print Engine libraries carry the printing: the Print Engine API declares the print job, the engine, the result, and the provider interfaces; the Print Engine Runtime compiles the model and renders the PDF; the Print Engine Runtime Kernel evaluates Computations; and the Print Model API defines and validates the Print Model. Print Models, Print Fragment Models, Typesetting Models, Document Models, documents, attachments, and static images reach them through provider interfaces. A project uses them one of two ways, and picks one. In the first, it embeds the Print Engine itself and its own code implements the provider interfaces. In the second, the A12 Full Stack path, two parts come together: the A12 Full Stack application, whose Forms and Overviews hold the print button, and Print Integration, which runs the print for the application; and Print Integration is what the project adds instead of writing that code itself. What these depend on: the A12 libraries Kernel, for Document Model access and document values, and Base, for the model foundations; the third-party library Apache PDFBox, which writes and tags the PDF; and, drawn with a dashed outline because it is the one part needed on only the second way, Data Services, for the models, documents, and attachments Print Integration loads and stores. The input is a Print Model, the template for the PDF; the Document Model that Print Model references for its dynamic content, with A12 documents and their attachments supplying the actual values; and, optionally, Print Fragment Models, which hold content that several Print Models share, and Typesetting Models. It produces a PDF tagged for PDF/UA and PDF/A-3a, whose conformance also depends on the model following the accessibility rules of the print modeling documentation, and optionally XML, standalone or embedded in the PDF.</desc>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#64748b"/>
    </marker>
    <style>
